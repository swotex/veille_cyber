<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille Cyber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c232c;--line:#262e38;--text:#e6edf3;--muted:#8b97a5;
  --accent:#4cc9f0;--crit:#ff5c6c;--high:#ff9f43;--med:#f5d547;--low:#5ad08c;--none:#6b7785;--kev:#ff5c6c;--watch:#b388ff;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
:root[data-theme="light"]{
  --bg:#f5f7fa;--panel:#fff;--panel2:#f0f3f7;--line:#dfe5ec;--text:#18212b;--muted:#5d6b7a;
  --accent:#0b7fb0;--crit:#d6293e;--high:#d97a14;--med:#a88a00;--low:#1d8c52;--none:#7a8794;--kev:#d6293e;--watch:#7a4fd1;
  --shadow:0 1px 2px rgba(20,30,40,.06);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f5f7fa;--panel:#fff;--panel2:#f0f3f7;--line:#dfe5ec;--text:#18212b;--muted:#5d6b7a;
  --accent:#0b7fb0;--crit:#d6293e;--high:#d97a14;--med:#a88a00;--low:#1d8c52;--none:#7a8794;--kev:#d6293e;--watch:#7a4fd1;
  --shadow:0 1px 2px rgba(20,30,40,.06);}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--low);box-shadow:0 0 0 4px color-mix(in srgb,var(--low) 22%,transparent)}
.dot.stale{background:var(--high);box-shadow:0 0 0 4px color-mix(in srgb,var(--high) 22%,transparent)}
.tabs{display:flex;gap:2px;margin-left:12px}
.tab{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.tab .n{margin-left:6px;font-size:11px;color:var(--muted)}
.spacer{flex:1}
.upd{color:var(--muted);font-size:12px;white-space:nowrap}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;height:32px;padding:0 10px;cursor:pointer;color:var(--muted)}
.ibtn:hover{color:var(--text)}
main{padding:20px 0 60px}
.stats{display:grid;grid-template-columns:repeat(4,1fr) 1.6fr;gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:54px;margin-top:6px}
.spark i{flex:1;background:var(--accent);opacity:.55;border-radius:2px 2px 0 0;min-height:2px;position:relative}
.spark i.today{opacity:1}
.spark i:hover{opacity:1}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:0;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--text)}
.field{background:var(--panel);border:1px solid var(--line);border-radius:9px;height:32px;padding:0 10px;outline:none}
.field:focus{border-color:var(--accent)}
input.field{min-width:220px;flex:1;max-width:340px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;height:30px;padding:0 12px;cursor:pointer;color:var(--muted);font-size:13px}
.chip[aria-pressed=true]{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.chip.k[aria-pressed=true]{border-color:var(--kev);background:color-mix(in srgb,var(--kev) 12%,var(--panel))}
.chip.w[aria-pressed=true]{border-color:var(--watch);background:color-mix(in srgb,var(--watch) 14%,var(--panel))}
.count{color:var(--muted);font-size:12px;margin:0 0 8px 2px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:64px 1fr;gap:14px;box-shadow:var(--shadow);border-left:3px solid var(--sevc,var(--none))}
.card:hover{border-color:color-mix(in srgb,var(--sevc,var(--none)) 50%,var(--line))}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:color-mix(in srgb,var(--sevc,var(--none)) 14%,transparent);color:var(--sevc,var(--none));height:56px}
.score b{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:10px;letter-spacing:.06em;margin-top:3px;font-weight:600}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.id{font-weight:600;font-size:14px}
.id:hover{color:var(--accent)}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.tag.kev{color:var(--kev);border-color:color-mix(in srgb,var(--kev) 45%,transparent);background:color-mix(in srgb,var(--kev) 10%,transparent);font-weight:600}
.tag.watch{color:var(--watch);border-color:color-mix(in srgb,var(--watch) 45%,transparent);background:color-mix(in srgb,var(--watch) 10%,transparent)}
.tag.ransom{color:var(--high);border-color:color-mix(in srgb,var(--high) 45%,transparent)}
.when{margin-left:auto;color:var(--muted);font-size:12px}
.desc{margin:4px 0 0;color:var(--text);opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .desc{-webkit-line-clamp:unset}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--muted);font-size:12px;align-items:center}
.epss{display:inline-flex;align-items:center;gap:6px}
.epss .tr{width:46px;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.epss .tr i{display:block;height:100%;background:var(--accent)}
.more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.card.open .more{display:block}
.more div{margin-bottom:4px}.more a{color:var(--accent);word-break:break-all}
.news{display:flex;flex-direction:column;gap:2px}
.item{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 10px;border-bottom:1px solid var(--line);border-radius:8px}
.item:hover{background:var(--panel)}
.item .src{font-size:12px;font-weight:600;color:var(--accent)}
.item .dt{font-size:11px;color:var(--muted)}
.item h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.item.read h3{color:var(--muted);font-weight:500}
.item p{margin:3px 0 0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lang{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted);vertical-align:middle}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.pager{display:flex;justify-content:center;margin-top:14px}
.pager button{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 18px;cursor:pointer}
.pager button:hover{border-color:var(--accent)}
.sevbars{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:12px;background:var(--panel2)}
.sevbars i{display:block;height:100%}
.legend{display:flex;gap:10px;margin-top:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend em{font-style:normal}
.legend em:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
.err{background:color-mix(in srgb,var(--high) 12%,var(--panel));border:1px solid var(--high);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.stats .wide{grid-column:1/-1}.upd{display:none}}
@media(max-width:640px){.card{grid-template-columns:1fr}.score{flex-direction:row;gap:8px;height:34px;justify-content:flex-start;padding:0 12px;width:max-content}.score span{margin:0}.item{grid-template-columns:1fr;gap:2px}.tabs{margin-left:0}.brand span{display:none}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="brand"><i class="dot" id="dot"></i><span>Veille Cyber</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="cve" aria-selected="true">CVE<span class="n" id="n-cve"></span></button>
    <button class="tab" role="tab" data-tab="kev" aria-selected="false">Exploitées<span class="n" id="n-kev"></span></button>
    <button class="tab" role="tab" data-tab="news" aria-selected="false">Actu<span class="n" id="n-news"></span></button>
  </nav>
  <div class="spacer"></div>
  <span class="upd" id="upd"></span>
  <button class="ibtn" id="theme" title="Changer de thème">◐</button>
</div></header>

<main class="wrap">
  <div id="err"></div>
  <section class="stats" id="stats"></section>
  <section id="view"></section>
</main>

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const SEVC = {CRITICAL:"var(--crit)", HIGH:"var(--high)", MEDIUM:"var(--med)", LOW:"var(--low)"};
const SEVL = {CRITICAL:"CRITIQUE", HIGH:"ÉLEVÉE", MEDIUM:"MOYENNE", LOW:"FAIBLE"};

const S = {
  tab: store.get("tab","cve"),
  cves: [], kev: null, news: null, meta: {}, cfg: {watchlist:[]}, index: {archives:[]},
  archives: {},
  f: { period: store.get("period","7"), sev: "", q: "", watch: false, kevOnly: false, sort: "date", limit: 50 },
  n: { src: "", lang: "", q: "", unread: false, limit: 40 },
  k: { q: "", limit: 50 },
  read: new Set(store.get("read", []))
};

async function getJSON(path, fallback){
  try{
    const r = await fetch(path + "?t=" + Math.floor(Date.now()/60000));
    if(!r.ok) throw new Error(r.status);
    return await r.json();
  }catch(e){ return fallback; }
}

function ago(iso){
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(s < 90) return "à l’instant";
  if(s < 3600) return Math.round(s/60) + " min";
  if(s < 86400) return Math.round(s/3600) + " h";
  if(s < 86400*30) return Math.round(s/86400) + " j";
  return new Date(iso).toLocaleDateString("fr-FR");
}
const fdate = iso => new Date(iso).toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const dayKey = d => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };

function watchHit(c){
  const h = (c.products.join(" ") + " " + c.desc).toLowerCase().replace(/_/g," ");
  return S.cfg.watchlist.find(w => h.includes(w.toLowerCase())) || null;
}

/* ---------- stats ---------- */
function renderStats(){
  const now = Date.now(), day = 864e5;
  const last24 = S.cves.filter(c => now - new Date(c.published) < day);
  const crit = last24.filter(c => (c.score||0) >= 9).length;
  const w = last24.filter(c => watchHit(c)).length;
  const kev7 = (S.kev?.items||[]).filter(e => now - new Date(e.added+"T00:00:00") < 7*day).length;
  const perDay = {};
  S.cves.forEach(c => { const k = dayKey(c.published); perDay[k] = (perDay[k]||0)+1; });
  const days = [];
  for(let i=29;i>=0;i--){ const d = new Date(now - i*day); const k = dayKey(d); days.push([k, perDay[k]||0]); }
  const max = Math.max(1, ...days.map(d=>d[1]));
  const week = S.cves.filter(c => now - new Date(c.published) < 7*day);
  const sev = {CRITICAL:0,HIGH:0,MEDIUM:0,LOW:0};
  week.forEach(c => { if(sev[c.sev]!==undefined) sev[c.sev]++; });
  const tot = Math.max(1, Object.values(sev).reduce((a,b)=>a+b,0));
  $("#stats").innerHTML = `
    <div class="stat"><div class="l">CVE · 24 h</div><div class="v">${last24.length}</div><div class="s">${week.length} sur 7 jours</div></div>
    <div class="stat"><div class="l">Critiques ≥ 9.0 · 24 h</div><div class="v" style="color:var(--crit)">${crit}</div><div class="s">${S.cves.filter(c=>(c.score||0)>=9&&now-new Date(c.published)<7*day).length} sur 7 jours</div></div>
    <div class="stat"><div class="l">Exploitées (KEV) · 7 j</div><div class="v" style="color:var(--kev)">${kev7}</div><div class="s">${S.kev?.total ?? "–"} au catalogue CISA</div></div>
    <div class="stat"><div class="l">Ma liste · 24 h</div><div class="v" style="color:var(--watch)">${w}</div><div class="s">${S.cfg.watchlist.length} produits suivis</div></div>
    <div class="stat wide"><div class="l">Publications · 30 jours</div>
      <div class="spark">${days.map(([k,n],i)=>`<i class="${i===29?"today":""}" style="height:${Math.max(4,n/max*100)}%" title="${k} : ${n} CVE"></i>`).join("")}</div>
      <div class="sevbars" title="Répartition 7 jours">${["CRITICAL","HIGH","MEDIUM","LOW"].map(s=>`<i style="width:${sev[s]/tot*100}%;background:${SEVC[s]}"></i>`).join("")}</div>
      <div class="legend">${["CRITICAL","HIGH","MEDIUM","LOW"].map(s=>`<em style="--c:${SEVC[s]}">${SEVL[s].toLowerCase()} ${sev[s]}</em>`).join("")}</div>
    </div>`;
}

/* ---------- CVE ---------- */
async function periodData(){
  const p = S.f.period;
  if(p !== "all") return S.cves;
  // historique : charge les archives mensuelles
  const out = [...S.cves];
  for(const a of S.index.archives){
    if(!S.archives[a.month]) S.archives[a.month] = await getJSON(`data/archive/${a.month}.json`, []);
    out.push(...S.archives[a.month]);
  }
  return out;
}

async function renderCVE(){
  const f = S.f;
  const all = await periodData();
  const now = Date.now();
  const span = {"1":864e5,"7":7*864e5,"30":30*864e5}[f.period];
  let rows = all.filter(c => (!span || now - new Date(c.published) < span));
  if(f.sev === "CRITICAL") rows = rows.filter(c => (c.score||0) >= 9);
  else if(f.sev === "HIGH") rows = rows.filter(c => (c.score||0) >= 7);
  else if(f.sev === "NONE") rows = rows.filter(c => c.score == null);
  if(f.kevOnly) rows = rows.filter(c => c.kev);
  if(f.watch) rows = rows.filter(c => watchHit(c));
  if(f.q){ const q = f.q.toLowerCase(); rows = rows.filter(c => (c.id+" "+c.desc+" "+c.products.join(" ")+" "+c.cwe.join(" ")).toLowerCase().includes(q)); }
  const cmp = {
    date: (a,b)=> b.published.localeCompare(a.published),
    cvss: (a,b)=> (b.score??-1)-(a.score??-1) || b.published.localeCompare(a.published),
    epss: (a,b)=> (b.epss??-1)-(a.epss??-1)
  }[f.sort];
  rows.sort(cmp);
  S._rows = rows;
  const shown = rows.slice(0, f.limit);
  $("#view").innerHTML = `
    <div class="toolbar">
      <div class="seg" id="period">${[["1","Aujourd’hui"],["7","7 jours"],["30","30 jours"],["all","Historique"]].map(([v,l])=>`<button data-v="${v}" aria-pressed="${f.period===v}">${l}</button>`).join("")}</div>
      <input class="field" id="q" placeholder="Rechercher (CVE, produit, CWE, mot-clé)…" value="${esc(f.q)}">
      <select class="field" id="sev">
        <option value="">Toutes sévérités</option><option value="CRITICAL">Critique ≥ 9</option><option value="HIGH">Élevée+ ≥ 7</option><option value="NONE">Sans score</option>
      </select>
      <select class="field" id="sort"><option value="date">Tri : récentes</option><option value="cvss">Tri : CVSS</option><option value="epss">Tri : EPSS</option></select>
      <button class="chip k" id="kevOnly" aria-pressed="${f.kevOnly}">🔥 Exploitées</button>
      <button class="chip w" id="watch" aria-pressed="${f.watch}">★ Ma liste</button>
      <span class="spacer"></span>
      <button class="ibtn" id="csv" title="Exporter la sélection">CSV ↓</button>
    </div>
    <p class="count">${rows.length.toLocaleString("fr-FR")} résultat${rows.length>1?"s":""}${f.period==="all"?" · historique complet":""}</p>
    <div class="list">${shown.map(cveCard).join("") || `<div class="empty">Aucune CVE pour ces filtres.</div>`}</div>
    ${rows.length > shown.length ? `<div class="pager"><button id="moreBtn">Afficher plus (${rows.length-shown.length})</button></div>`:""}`;
  $("#sev").value = f.sev; $("#sort").value = f.sort;
  $("#period").onclick = e => { const b = e.target.closest("button"); if(!b) return; f.period = b.dataset.v; f.limit = 50; store.set("period", f.period); renderCVE(); };
  $("#q").oninput = debounce(e => { f.q = e.target.value; f.limit = 50; renderCVE().then(()=>{ const i=$("#q"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }); }, 200);
  $("#sev").onchange = e => { f.sev = e.target.value; f.limit = 50; renderCVE(); };
  $("#sort").onchange = e => { f.sort = e.target.value; renderCVE(); };
  $("#kevOnly").onclick = () => { f.kevOnly = !f.kevOnly; renderCVE(); };
  $("#watch").onclick = () => { f.watch = !f.watch; renderCVE(); };
  $("#csv").onclick = exportCSV;
  const mb = $("#moreBtn"); if(mb) mb.onclick = () => { f.limit += 100; renderCVE(); };
  $(".list").onclick = e => { if(e.target.closest("a")) return; const c = e.target.closest(".card"); if(c) c.classList.toggle("open"); };
}

function cveCard(c){
  const col = SEVC[c.sev] || "var(--none)";
  const w = watchHit(c);
  const ep = c.epss != null ? `<span class="epss" title="Probabilité d’exploitation sous 30 jours (EPSS), percentile ${(c.pct*100).toFixed(0)}">EPSS <b class="mono">${(c.epss*100).toFixed(c.epss<.1?1:0)}%</b><span class="tr"><i style="width:${Math.min(100,c.epss*100)}%"></i></span></span>` : "";
  return `<article class="card" style="--sevc:${col}">
    <div class="score"><b>${c.score ?? "–"}</b><span>${c.score!=null ? SEVL[c.sev]||"" : "EN ATTENTE"}</span></div>
    <div>
      <div class="top">
        <a class="id mono" href="https://nvd.nist.gov/vuln/detail/${c.id}" target="_blank" rel="noopener">${c.id}</a>
        ${c.kev?`<span class="tag kev">🔥 EXPLOITÉE</span>`:""}
        ${w?`<span class="tag watch">★ ${esc(w)}</span>`:""}
        ${c.cwe.map(x=>`<span class="tag mono">${x}</span>`).join("")}
        <span class="when" title="${fdate(c.published)}">${ago(c.published)}</span>
      </div>
      <p class="desc">${esc(c.desc)}</p>
      <div class="meta">${ep}${c.products.slice(0,3).map(p=>`<span class="mono">${esc(p.replace(":"," / "))}</span>`).join("")}</div>
      <div class="more">
        ${c.vector?`<div>Vecteur : <span class="mono">${esc(c.vector)}</span></div>`:""}
        <div>Publiée le ${fdate(c.published)} · modifiée le ${fdate(c.modified)}${c.status?` · ${esc(c.status)}`:""}</div>
        ${c.products.length>3?`<div>Produits : <span class="mono">${esc(c.products.join(", "))}</span></div>`:""}
        ${c.refs.map(r=>`<div><a href="${esc(r)}" target="_blank" rel="noopener">${esc(r)}</a></div>`).join("")}
      </div>
    </div></article>`;
}

function exportCSV(){
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const head = ["id","publiee","cvss","severite","epss","kev","produits","description"];
  const lines = S._rows.map(c => [c.id,c.published,c.score,c.sev,c.epss,c.kev,c.products.join(" | "),c.desc].map(q).join(","));
  const blob = new Blob(["﻿"+head.join(",")+"\n"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `cve-${dayKey(Date.now())}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- KEV ---------- */
function renderKEV(){
  const items = (S.kev?.items||[]).filter(e => !S.k.q || (e.cve+" "+e.vendor+" "+e.product+" "+e.name).toLowerCase().includes(S.k.q.toLowerCase()));
  const shown = items.slice(0, S.k.limit);
  $("#view").innerHTML = `
    <div class="toolbar"><input class="field" id="kq" placeholder="Rechercher (éditeur, produit, CVE)…" value="${esc(S.k.q)}"></div>
    <p class="count">${items.length} vulnérabilité${items.length>1?"s":""} ajoutée${items.length>1?"s":""} au catalogue CISA KEV ces 120 derniers jours — exploitation active confirmée</p>
    <div class="list">${shown.map(e => `
      <article class="card" style="--sevc:var(--kev)">
        <div class="score"><b>${e.epss!=null?(e.epss*100).toFixed(e.epss<.1?1:0)+"%":"–"}</b><span>EPSS</span></div>
        <div>
          <div class="top">
            <a class="id mono" href="https://nvd.nist.gov/vuln/detail/${e.cve}" target="_blank" rel="noopener">${e.cve}</a>
            <span class="tag">${esc(e.vendor)} · ${esc(e.product)}</span>
            ${e.ransomware?`<span class="tag ransom">ransomware</span>`:""}
            <span class="when">ajoutée le ${new Date(e.added).toLocaleDateString("fr-FR")}</span>
          </div>
          <p class="desc" style="-webkit-line-clamp:unset">${esc(e.name)}</p>
          <div class="meta"><span>Échéance CISA : ${e.due?new Date(e.due).toLocaleDateString("fr-FR"):"–"}</span><span>${esc(e.action)}</span></div>
        </div></article>`).join("") || `<div class="empty">Rien à afficher.</div>`}</div>
    ${items.length>shown.length?`<div class="pager"><button id="moreBtn">Afficher plus</button></div>`:""}`;
  $("#kq").oninput = debounce(e => { S.k.q = e.target.value; renderKEV(); const i=$("#kq"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }, 200);
  const mb = $("#moreBtn"); if(mb) mb.onclick = () => { S.k.limit += 100; renderKEV(); };
}

/* ---------- Actu ---------- */
function renderNews(){
  const n = S.n, all = S.news?.items || [];
  let rows = all.filter(i =>
    (!n.src || i.source === n.src) && (!n.lang || i.lang === n.lang) &&
    (!n.unread || !S.read.has(i.link)) &&
    (!n.q || (i.title+" "+i.summary).toLowerCase().includes(n.q.toLowerCase())));
  const shown = rows.slice(0, n.limit);
  const unread = all.filter(i => !S.read.has(i.link)).length;
  $("#view").innerHTML = `
    <div class="toolbar">
      <input class="field" id="nq" placeholder="Rechercher dans l’actu…" value="${esc(n.q)}">
      <select class="field" id="nsrc"><option value="">Toutes les sources</option>${(S.news?.sources||[]).map(s=>`<option ${n.src===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
      <div class="seg" id="nlang">${[["","Tout"],["fr","FR"],["en","EN"]].map(([v,l])=>`<button data-v="${v}" aria-pressed="${n.lang===v}">${l}</button>`).join("")}</div>
      <button class="chip" id="nunread" aria-pressed="${n.unread}">Non lus (${unread})</button>
      <span class="spacer"></span>
      <button class="ibtn" id="markall">Tout marquer lu</button>
    </div>
    <p class="count">${rows.length} article${rows.length>1?"s":""}</p>
    <div class="news">${shown.map(i => `
      <a class="item ${S.read.has(i.link)?"read":""}" href="${esc(i.link)}" target="_blank" rel="noopener" data-l="${esc(i.link)}">
        <div><div class="src">${esc(i.source)}</div><div class="dt">${ago(i.published)}</div></div>
        <div><h3>${esc(i.title)}<span class="lang">${i.lang.toUpperCase()}</span></h3>${i.summary?`<p>${esc(i.summary)}</p>`:""}</div>
      </a>`).join("") || `<div class="empty">Aucun article.</div>`}</div>
    ${rows.length>shown.length?`<div class="pager"><button id="moreBtn">Afficher plus</button></div>`:""}`;
  $("#nq").oninput = debounce(e => { n.q = e.target.value; renderNews(); const i=$("#nq"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }, 200);
  $("#nsrc").onchange = e => { n.src = e.target.value; n.limit = 40; renderNews(); };
  $("#nlang").onclick = e => { const b = e.target.closest("button"); if(!b) return; n.lang = b.dataset.v; renderNews(); };
  $("#nunread").onclick = () => { n.unread = !n.unread; renderNews(); };
  $("#markall").onclick = () => { all.forEach(i => S.read.add(i.link)); saveRead(); renderNews(); updateCounts(); };
  const mb = $("#moreBtn"); if(mb) mb.onclick = () => { n.limit += 60; renderNews(); };
  $(".news").onclick = e => { const a = e.target.closest(".item"); if(a){ S.read.add(a.dataset.l); saveRead(); a.classList.add("read"); updateCounts(); } };
}
function saveRead(){ store.set("read", [...S.read].slice(-3000)); }

/* ---------- commun ---------- */
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
function updateCounts(){
  const unread = (S.news?.items||[]).filter(i => !S.read.has(i.link)).length;
  $("#n-news").textContent = unread ? unread : "";
  const now = Date.now();
  $("#n-cve").textContent = S.cves.filter(c => now - new Date(c.published) < 864e5).length || "";
  $("#n-kev").textContent = (S.kev?.items||[]).filter(e => now - new Date(e.added+"T00:00:00") < 3*864e5).length || "";
}
function show(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === S.tab));
  ({cve: renderCVE, kev: renderKEV, news: renderNews})[S.tab]();
}
document.querySelector(".tabs").onclick = e => { const t = e.target.closest(".tab"); if(!t) return; S.tab = t.dataset.tab; store.set("tab", S.tab); show(); window.scrollTo({top:0}); };
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const next = cur === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next; store.set("theme", next);
};
const th = store.get("theme", null); if(th) document.documentElement.dataset.theme = th;

async function init(){
  const [cves, kev, news, meta, cfg, index] = await Promise.all([
    getJSON("data/cves.json", []), getJSON("data/kev.json", null), getJSON("data/news.json", null),
    getJSON("data/meta.json", {}), getJSON("config.json", {watchlist:[]}), getJSON("data/index.json", {archives:[]})
  ]);
  Object.assign(S, {cves, kev, news, meta, cfg, index});
  const age = meta.generated_at ? (Date.now() - new Date(meta.generated_at))/36e5 : null;
  $("#upd").textContent = meta.generated_at ? "Mis à jour il y a " + ago(meta.generated_at) : "Pas encore de données";
  $("#dot").classList.toggle("stale", age === null || age > 8);
  if(meta.errors?.length) $("#err").innerHTML = `<div class="err">Dernière collecte partielle : ${meta.errors.map(esc).join(" · ")}</div>`;
  else if(!cves.length) $("#err").innerHTML = `<div class="err">Aucune donnée pour l’instant. Lance le workflow « Mise à jour » dans l’onglet Actions de GitHub (voir README).</div>`;
  renderStats(); updateCounts(); show();
}
init();
setInterval(init, 10*60*1000);
</script>
</body>
</html>
